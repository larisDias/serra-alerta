name: Publicar APK (GitHub Releases)

# Ao criar uma tag `v*` (ex.: `git tag v1.0.0 && git push origin v1.0.0`), gera o APK e o anexa à release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar o SDK do Android (plataforma 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Testes e APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Nomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "serra-alerta-${GITHUB_REF_NAME}.apk"

      # Sem tag (execução manual), o APK vai só como artefato da execução.
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: serra-alerta-apk
          path: app-android/serra-alerta-*.apk

      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "serra-alerta-${GITHUB_REF_NAME}.apk" \
            --title "Serra Alerta ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "APK de debug para instalação direta (Android 7.0+). Ao instalar, permita a instalação de fontes desconhecidas."
