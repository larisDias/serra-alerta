name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  # Atualiza o snapshot dos focos de calor do INPE (uma consulta só, o build continua rápido).
  # A cada 6 h no primeiro mês, só às segundas até o 3º mês e depois nunca mais (o job `agenda` decide).
  schedule:
    - cron: '17 */6 * * *'
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # A partir desta data o snapshot passa a ser atualizado só semanalmente (o navegador já consulta o INPE ao vivo).
  ATUALIZACAO_SEMANAL_A_PARTIR_DE: '2026-10-28'
  # A partir desta data os agendamentos deixam de atualizar o snapshot (push e execução manual continuam valendo).
  ATUALIZACAO_AGENDADA_ATE: '2026-12-28'

jobs:
  agenda:
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.decidir.outputs.rodar }}
    steps:
      - id: decidir
        shell: bash
        run: |
          rodar=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hoje="$(date -u +%F)"
            semanal=false
            [[ ! "$hoje" < "$ATUALIZACAO_SEMANAL_A_PARTIR_DE" ]] && semanal=true
            if [[ ! "$hoje" < "$ATUALIZACAO_AGENDADA_ATE" ]]; then
              rodar=false
            elif [ "$semanal" = true ]; then
              [ "${{ github.event.schedule }}" = "17 3 * * 1" ] || rodar=false
            else
              [ "${{ github.event.schedule }}" = "17 */6 * * *" ] || rodar=false
            fi
          fi
          echo "rodar=$rodar" >> "$GITHUB_OUTPUT"

  build:
    needs: agenda
    if: needs.agenda.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/landing/database/database.sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar o app (chave, banco com relatos de exemplo)
        run: |
          echo "APP_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"
          echo "APP_KEY=base64:$(head -c 32 /dev/urandom | base64)" >> "$GITHUB_ENV"
          touch database/database.sqlite

      - run: php artisan migrate --seed --force

      - run: php artisan site:exportar dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
