# Ferramentas para rodar e testar o projeto sem instalar nada no sistema (nem o Android Studio).
# Uso: `mise install` na raiz; `mise run --list` mostra as tarefas.
[tools]
java = "temurin-25"

# PHP estático pré-compilado (evita compilar o PHP); só para Linux x64/WSL.
# Em Windows/macOS, use o PHP do XAMPP/Homebrew.
"http:php" = { version = "8.4.23", url = "https://dl.static-php.dev/static-php-cli/bulk/php-{{version}}-cli-linux-x86_64.tar.gz" }
"http:composer" = { version = "2.9.5", url = "https://getcomposer.org/download/{{version}}/composer.phar" }

[env]
# SDK do Android instalado só com as ferramentas de linha de comando (veja `mise run android:sdk`).
ANDROID_HOME = "{{env.HOME}}/android-sdk"

# ---------- Site (landing + demo) ----------
[tasks."site:setup"]
description = "Instala dependências do site, cria o .env e o banco com os relatos de exemplo"
dir = "landing"
run = """
php "$(mise where http:composer)/composer.phar" install --no-interaction
[ -f .env ] || cp .env.example .env
php artisan key:generate --ansi
touch database/database.sqlite
php artisan migrate:fresh --seed --force
"""

[tasks."site:test"]
description = "Roda os testes do site (Laravel)"
dir = "landing"
run = "php artisan test"

[tasks."site:serve"]
description = "Sobe o site em http://127.0.0.1:8000"
dir = "landing"
run = "php artisan serve"

# ---------- App Android ----------
[tasks."android:sdk"]
description = "Baixa o SDK do Android (cmdline-tools, plataforma 37, build-tools) sem o Android Studio"
run = """
set -e
SDK="$ANDROID_HOME"
if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
  mkdir -p "$SDK"
  curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
  python3 -c "import zipfile;zipfile.ZipFile('/tmp/cmdline-tools.zip').extractall('$SDK/tmpx')"
  mkdir -p "$SDK/cmdline-tools" && mv "$SDK/tmpx/cmdline-tools" "$SDK/cmdline-tools/latest" && rmdir "$SDK/tmpx"
  chmod +x "$SDK"/cmdline-tools/latest/bin/*
fi
# Aceita as licenças do SDK do Android; leia em https://developer.android.com/studio/terms
yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
"$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
"""

[tasks."android:test"]
description = "Roda os testes unitários do app Android"
dir = "app-android"
run = "./gradlew :app:testDebugUnitTest"

[tasks."android:apk"]
description = "Gera o APK de debug em app-android/app/build/outputs/apk/debug/"
dir = "app-android"
run = "./gradlew :app:assembleDebug"
